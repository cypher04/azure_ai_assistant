
stages:
  - validate
  - plan
  - apply
  - destroy
  
variables:
  TF_ROOT: env/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

default:
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]          # the image's entrypoint is terraform itself
  cache:
    key: "--"
    paths:
      - /.terraform

# Everything Azure-touching extends this. One before_script only —
#  overwrites the key, it does not concatenate.
.azure:
  id_tokens:
    AZURE_ID_TOKEN:
      aud: https://gitlab.com   # must equal the federated credential's audience
  before_script:
    - export ARM_USE_OIDC=true
    - export ARM_OIDC_TOKEN=""
    - export ARM_CLIENT_ID=""
    - export ARM_TENANT_ID=""
    - export ARM_SUBSCRIPTION_ID=""
    - cd ""
    - terraform init -input=false

# No Azure credentials needed, so this runs on every branch and MR.
validate:
  stage: validate
  script:
    - terraform -chdir="" fmt -check -recursive
    - terraform -chdir="" init -backend=false -input=false
    - terraform -chdir="" validate
  rules:
    - if:  == "merge_request_event"
    - if: 

plan:
  stage: plan
  extends: .azure
  script:
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan
  artifacts:
    paths:
      - /tfplan       # artifact paths are relative to the project dir
    expire_in: 7 days
  rules:
    - if:  == 

apply:
  stage: apply
  extends: .azure
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  environment:
    name: main              # matches gitlab_project_environment.default_branch_env
  resource_group: tf-dev    # serializes applies — never two at once on one state
  rules:
    - if:  == 
      when: manual
      allow_failure: false


destroy:
  stage: destroy
  extends: .azure
  script:
    - terraform destroy -auto-approve
  environment:
    name: main
  resource_group: tf-dev
  rules:
    - if:  == 
      when: manual
      allow_failure: false

