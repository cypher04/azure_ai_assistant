
stages:
  - validate
  - plan
  - apply
  - app-deploy
  - ingest
  - destroy
  
variables:
  TF_ROOT: env/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

default:
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]          # the image's entrypoint is terraform itself
  cache:
    key: "$CI_COMMIT_REF_NAME-$CI_JOB_NAME-$TF_ROOT"
    paths:
      - $TF_ROOT/.terraform

# Everything Azure-touching extends this. One before_script only —
#  overwrites the key, it does not concatenate.
.azure:
  id_tokens:
    AZURE_ID_TOKEN:
      aud: https://gitlab.com   # must equal the federated credential's audience
  before_script:
    - export ARM_USE_OIDC=true
    - export ARM_OIDC_TOKEN="$AZURE_ID_TOKEN"
    - export ARM_CLIENT_ID="$AZUREAD_CLIENT_ID"
    - export ARM_TENANT_ID="$AZUREAD_TENANT_ID"
    - export ARM_SUBSCRIPTION_ID="$AZUREAD_SUBSCRIPTION_ID"
    - terraform -chdir="$TF_ROOT" init -input=false

# Azure app-specific configuration — signs in with az CLI as the app principal
.azure-app:
  image: mcr.microsoft.com/azure-cli:latest
  id_tokens:
    AZURE_ID_TOKEN:
      aud: https://gitlab.com   # must equal the federated credential's audience
  before_script:
    - az login --service-principal
        --username "$AZUREAD_APP_CLIENT_ID"
        --tenant "$AZUREAD_TENANT_ID"
        --federated-token "$AZURE_ID_TOKEN"
        --allow-no-subscriptions
    - az account set --subscription "$AZUREAD_SUBSCRIPTION_ID"


# No Azure credentials needed, so this runs on every branch and MR.
validate:
  stage: validate
  script:
    - terraform -chdir="$TF_ROOT" fmt -check -recursive
    - terraform -chdir="$TF_ROOT" init -backend=false -input=false
    - terraform -chdir="$TF_ROOT" validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE

plan:
  stage: plan
  extends: .azure
  script:
    - terraform -chdir="$TF_ROOT" plan -out=tfplan
    - terraform -chdir="$TF_ROOT" show -no-color tfplan
  artifacts:
    paths:
      - $TF_ROOT/tfplan       # artifact paths are relative to the project dir
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:
  stage: apply
  extends: .azure
  script:
    - terraform -chdir="$TF_ROOT" apply -auto-approve tfplan
  dependencies:
    - plan
  environment:
    name: main              # matches gitlab_project_environment.default_branch_env
  resource_group: tf-dev    # serializes applies — never two at once on one state
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

app-deploy:
  stage: app-deploy
  extends: .azure-app
  script:
    - cd app && python3 -m zipfile -c ../app.zip main.py requirements.txt static && cd ..
    - APP_NAME=$(az webapp list --resource-group app-rg --query "[0].name" -o tsv)
    - az webapp deploy --resource-group app-rg --name "$APP_NAME" --src-path app.zip --type zip
  dependencies:
    - apply
  environment:
    name: main
  resource_group: app-rg
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

ingest:
  stage: ingest
  extends: .azure-app
  script:
    - echo "Running ingest job..."
    - export AZURE_STORAGE_ACCOUNT_URL=$(az storage account list --resource-group database-rg --query "[0].primaryEndpoints.blob" -o tsv)
    - export AZURE_SEARCH_ENDPOINT="https://$(az search service list --resource-group compute-rg --query "[0].name" -o tsv).search.windows.net"
    - export AZURE_OPENAI_ENDPOINT=$(az cognitiveservices account list --resource-group compute-rg --query "[0].properties.endpoint" -o tsv)
    - python3 -m venv .venv && . .venv/bin/activate
    - pip3 install -r search/requirements.txt
    - python3 search/ingest.py
  environment:
    name: main
  resource_group: app-rg
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual



destroy:
  stage: destroy
  extends: .azure
  script:
    - terraform -chdir="$TF_ROOT" destroy -auto-approve
  environment:
    name: main
  resource_group: tf-dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

